openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Biblioteca de Prompts API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: prompts
    description: Prompt management
  - name: categories
    description: Category management
  - name: ai
    description: AI generation operations
  - name: stats
    description: Dashboard statistics
  - name: plans
    description: Subscription plans

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Categories ─────────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  # ─── Prompts ─────────────────────────────────────────────────────────────────
  /prompts:
    get:
      operationId: listPrompts
      tags: [prompts]
      summary: List prompts
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: visibility
          in: query
          schema:
            type: string
            enum: [public, private, all]
        - name: favorites
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptListResponse"
    post:
      operationId: createPrompt
      tags: [prompts]
      summary: Create a prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"

  /prompts/popular:
    get:
      operationId: listPopularPrompts
      tags: [prompts]
      summary: List popular/trending public prompts
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Popular prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"

  /prompts/recent:
    get:
      operationId: listRecentPrompts
      tags: [prompts]
      summary: List recently created public prompts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"

  /prompts/{id}:
    get:
      operationId: getPrompt
      tags: [prompts]
      summary: Get a prompt by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePrompt
      tags: [prompts]
      summary: Update a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePrompt
      tags: [prompts]
      summary: Delete a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /prompts/{id}/favorite:
    patch:
      operationId: toggleFavorite
      tags: [prompts]
      summary: Toggle favorite on a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"

  /prompts/{id}/like:
    patch:
      operationId: toggleLike
      tags: [prompts]
      summary: Toggle like on a public prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"

  /prompts/{id}/use:
    post:
      operationId: recordUse
      tags: [prompts]
      summary: Record that a prompt was used (increments use count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"

  # ─── AI ──────────────────────────────────────────────────────────────────────
  /ai/generate:
    post:
      operationId: generatePrompt
      tags: [ai]
      summary: Generate a prompt with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: Generated prompt text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/refine:
    post:
      operationId: refinePrompt
      tags: [ai]
      summary: Refine an existing prompt with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineInput"
      responses:
        "200":
          description: Refined prompt text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"

  # ─── Stats ───────────────────────────────────────────────────────────────────
  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard statistics for current user
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  # ─── Plans ───────────────────────────────────────────────────────────────────
  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List all subscription plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /subscription:
    get:
      operationId: getSubscription
      tags: [plans]
      summary: Get current user subscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [plans]
      summary: Subscribe to a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    # ─── Auth ──────────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, name, email, plan, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        plan:
          type: string
          enum: [basic, pro, premium]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    # ─── Category ─────────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, name, slug, promptCount]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: ["string", "null"]
        promptCount:
          type: integer

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        icon:
          type: string

    # ─── Prompt ───────────────────────────────────────────────────────────────
    Prompt:
      type: object
      required: [id, title, content, categoryId, categoryName, visibility, isFavorite, likeCount, useCount, rating, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        description:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: string
        tags:
          type: array
          items:
            type: string
        visibility:
          type: string
          enum: [public, private]
        isFavorite:
          type: boolean
        likeCount:
          type: integer
        useCount:
          type: integer
        rating:
          type: number
        authorName:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PromptInput:
      type: object
      required: [title, content, categoryId]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        description:
          type: string
        categoryId:
          type: integer
        tags:
          type: array
          items:
            type: string
        visibility:
          type: string
          enum: [public, private]

    PromptUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        description:
          type: string
        categoryId:
          type: integer
        tags:
          type: array
          items:
            type: string
        visibility:
          type: string
          enum: [public, private]

    PromptListResponse:
      type: object
      required: [prompts, total, page, limit]
      properties:
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/Prompt"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ─── AI ────────────────────────────────────────────────────────────────────
    GenerateInput:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          minLength: 3
        category:
          type: string
        style:
          type: string

    RefineInput:
      type: object
      required: [content, instruction]
      properties:
        content:
          type: string
        instruction:
          type: string

    GenerateResponse:
      type: object
      required: [content, title]
      properties:
        content:
          type: string
        title:
          type: string
        suggestedTags:
          type: array
          items:
            type: string

    # ─── Stats ─────────────────────────────────────────────────────────────────
    UserStats:
      type: object
      required: [totalPrompts, favoritePrompts, publicPrompts, privatePrompts, totalUses, totalLikes, aiGenerationsUsed, aiGenerationsLimit]
      properties:
        totalPrompts:
          type: integer
        favoritePrompts:
          type: integer
        publicPrompts:
          type: integer
        privatePrompts:
          type: integer
        totalUses:
          type: integer
        totalLikes:
          type: integer
        aiGenerationsUsed:
          type: integer
        aiGenerationsLimit:
          type: integer
        promptsLimit:
          type: ["integer", "null"]

    # ─── Plans ─────────────────────────────────────────────────────────────────
    Plan:
      type: object
      required: [id, name, slug, price, promptsLimit, aiGenerationsLimit, sharingEnabled, exclusiveTemplates]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
          enum: [basic, pro, premium]
        price:
          type: number
        promptsLimit:
          type: ["integer", "null"]
        aiGenerationsLimit:
          type: integer
        sharingEnabled:
          type: boolean
        exclusiveTemplates:
          type: string
          enum: [none, partial, full]
        description:
          type: string

    Subscription:
      type: object
      required: [planSlug, planName, price, status, createdAt]
      properties:
        planSlug:
          type: string
        planName:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [active, cancelled, expired]
        createdAt:
          type: string
        expiresAt:
          type: ["string", "null"]

    SubscriptionInput:
      type: object
      required: [planSlug]
      properties:
        planSlug:
          type: string
          enum: [basic, pro, premium]
